name: Generate GitHub Stats Cards

# Regenerates the self-hosted stat cards from live GitHub data.
# No external stats services (github-readme-stats.vercel.app,
# streak-stats.demolab.com, ...) are involved at any point.
on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contribution token access
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          TOKEN_SOURCE: ${{ secrets.GH_STATS_TOKEN != '' && 'GH_STATS_TOKEN' || 'GITHUB_TOKEN' }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          printf 'Contribution API token source: %s\n' "$TOKEN_SOURCE"
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            --data '{"query":"query($from: DateTime!, $to: DateTime!) { viewer { contributionsCollection(from: $from, to: $to) { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }","variables":{"from":"2026-10-25T00:00:00Z","to":"2026-10-26T00:00:00Z"}}' \
            > "$response"
          if jq -e '.errors and (.errors | length > 0)' "$response" >/dev/null; then
            echo "::error::The selected token was rejected by the GitHub GraphQL API."
            exit 1
          fi
          count="$(jq -r '[.data.viewer.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date == "2026-10-25") | .contributionCount] | if length == 1 then .[0] else "not present" end' "$response")"
          if [ "$count" = "not present" ]; then
            echo "October 25, 2026 is not present in the returned calendar."
          else
            echo "October 25, 2026 contribution count: $count"
            if [ "$count" = "0" ]; then
              echo "::warning::The selected token does not show contributions for October 25, 2026; check token authorization and private/internal repository contribution visibility."
            fi
          fi

      - name: Fetch GitHub data and generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 profile/scripts/generate_stats.py

      - name: Validate generated SVG files
        run: |
          set -e
          for f in profile/github-stats.svg profile/github-streak.svg profile/top-languages.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
            if ! head -c 200 "$f" | grep -q "<svg"; then
              echo "::error::$f does not contain valid SVG markup"
              exit 1
            fi
            python3 -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); assert root.tag == "{http://www.w3.org/2000/svg}svg" and root.get("viewBox")' "$f"
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Commit changed cards
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(stats): refresh self-hosted stats cards [skip ci]"
          file_pattern: profile/*.svg
          # Nothing is staged automatically; unchanged files simply produce no commit.
          commit_options: "--no-verify"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changes_detected }}" = "true" ]; then
            echo "### Stats cards updated" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat HEAD^ HEAD -- profile/*.svg >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "### No changes — cards are already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
